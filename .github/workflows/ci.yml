name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores fictícios e públicos. O build não pode depender do banco nem de
      # segredos reais: nenhuma página consulta o banco durante a pré-renderização.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/meu_finan_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/meu_finan_ci
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      OWNER_EMAIL: owner@example.com
      CRON_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Cache do build do Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
